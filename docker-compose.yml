services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RATE_LIMIT_PER_SEC=20 #限流速率：须低于应用真实容量（本机 ~47 QPS），压测流量才会过载并触发限流，A/B 才能演示过载保护
      - BUSINESS_TIMEOUT_MS=200 #业务超时预算：Docker-Windows 网络路径单请求 ~50ms，50ms 预算会让多数请求误转 202 排队，失真压测 Success 指标
      - BREAKER_FAIL_THRESHOLD=8 #熔断失败阈值
      - BREAKER_WINDOW_SEC=10 #熔断窗口时间
      - BREAKER_OPEN_SEC=8 #熔断打开时间
      - ENABLE_RESILIENCE=true #启用熔断
      - INVENTORY_BUSY_PROB=0.025 #库存繁忙概率
      - ORDER_TTL_SEC=604800 #订单超时时间
      - CIRCUIT_PROBE_TTL_SEC=30 #熔断探针超时时间
    cap_add:
      - NET_ADMIN #允许修改网络配置,赋予了容器修改网络堆栈的权限 tc
    depends_on:
      - redis
  app_baseline:
    build: .
    ports:
      - "5001:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENABLE_RESILIENCE=false
      - ORDER_TTL_SEC=604800
      - CIRCUIT_PROBE_TTL_SEC=30
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus