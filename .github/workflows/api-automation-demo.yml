name: api-automation-demo

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  yaml-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api-automation-demo/requirements.txt

      - name: Pytest + Allure results
        working-directory: api-automation-demo
        run: pytest --alluredir=allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-automation-allure-results
          path: api-automation-demo/allure-results
