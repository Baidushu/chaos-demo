name: qa-pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  pr-fast-feedback:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app

      - name: Black
        run: black --check app

      - name: Mypy
        run: mypy app

      - name: Pytest (unit + smoke)
        run: pytest tests/ -m "unit or smoke" --junitxml=reports/pytest-pr.xml -q

      - name: Upload PR pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-pr-report
          path: reports/pytest-pr.xml

  full-quality-gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: pr-fast-feedback
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest (full with coverage)
        run: >
          pytest tests/
          --cov=app
          --cov=chaos_service
          --cov-report=term-missing
          --cov-fail-under=85
          --junitxml=reports/pytest-full.xml
          -q

      - name: Upload full pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-full-report
          path: reports/pytest-full.xml

  nightly-stability:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest (integration + chaos + e2e)
        run: >
          pytest tests/
          -m "integration or chaos or e2e"
          --junitxml=reports/pytest-nightly.xml
          -q

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:5000/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App not ready in time"
          exit 1

      - name: API automation
        env:
          API_AUTOMATION_BASE_URL: http://127.0.0.1:5000
        working-directory: api-automation-demo
        run: pytest --alluredir=allure-results -q

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-automation-allure-results
          path: api-automation-demo/allure-results

      - name: Benchmark compare
        env:
          BENCHMARK_WARMUP: "20"
          BENCHMARK_SEED: "7"
          BENCHMARK_RUNS: "3"
        run: python benchmark_compare.py

      - name: Security scan gate
        env:
          SECURITY_SCAN_BASE_URL: http://127.0.0.1:5000
          SECURITY_FAIL_ON: medium
        run: python security_scan.py

      - name: Agent eval
        env:
          TOOLS_BASE_URL: http://127.0.0.1:5000
          AGENT_MODE: rule
          AGENT_EVAL_SKIP_JUDGE: "1"
        run: python agent-eval/scripts/chaos_compare.py --strict

      - name: Trace timeline
        if: always()
        run: python trace_timeline.py

      - name: Unified quality gate
        env:
          SECURITY_FAIL_ON: medium
        run: python unified_quality_gate.py

      - name: Unified platform summary
        if: always()
        run: python unified_summary.py

      - name: Upload nightly pytest report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-nightly-report
          path: reports/pytest-nightly.xml

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            reports/benchmark_latest.json
            reports/benchmark_trend_latest.json
            reports/benchmark_trend_latest.md
            reports/security_scan_latest.json
            reports/security_scan_latest.md
            reports/unified_quality_gate_latest.json
            reports/unified_summary_latest.json
            reports/unified_summary_latest.md
            reports/trace_timeline_latest.mmd
            reports/trace_timeline_latest.html
            reports/trace_timeline_meta.json
            reports/traffic_replay_latest.json
            reports/traffic_replay_latest.md

      - name: Upload agent-eval reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-reports
          path: |
            agent-eval/reports/chaos_compare_latest.json
            agent-eval/reports/chaos_compare_latest.md
            agent-eval/reports/agent_eval_latest.json
            agent-eval/reports/agent_eval_latest.md
