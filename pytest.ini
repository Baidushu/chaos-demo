[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers
markers =
    unit: unit tests for isolated logic and local fakes
    smoke: quick smoke tests for fast local and PR feedback
    contract: API contract tests for status codes and JSON shapes
    integration: tests requiring component collaboration or real dependencies
    e2e: end-to-end tests across the in-process HTTP stack
    chaos: chaos experiment and fault injection tests
    slow: longer-running perf and regression checks
    redis: tests that rely on Redis semantics or a real Redis instance
    resilience: reliability and resilience component tests
