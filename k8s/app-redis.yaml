# ============================================================
# K8s 部署清单：订单服务 + Redis
# 面试要点：Deployment/Service/探针/环境变量/资源限制
# ============================================================

# ---- App Deployment ----
# Deployment：管理 Pod 副本，自动处理滚动更新和自愈
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  # 3 副本：模拟多实例部署，与 Gunicorn 多 worker 配合
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      containers:
        - name: app
          # 本地构建：docker build -t chaos-demo-app:latest .
          image: chaos-demo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

          # 环境变量：与 docker-compose.yml 保持一致
          env:
            - name: REDIS_HOST
              value: redis              # K8s Service 名自动解析为 ClusterIP
            - name: REDIS_PORT
              value: "6379"
            - name: RATE_LIMIT_PER_SEC
              value: "80"
            - name: BUSINESS_TIMEOUT_MS
              value: "50"
            - name: BREAKER_FAIL_THRESHOLD
              value: "8"
            - name: BREAKER_WINDOW_SEC
              value: "10"
            - name: BREAKER_OPEN_SEC
              value: "8"
            - name: ENABLE_RESILIENCE
              value: "true"
            - name: INVENTORY_BUSY_PROB
              value: "0.025"
            - name: ORDER_TTL_SEC
              value: "604800"
            - name: CIRCUIT_PROBE_TTL_SEC
              value: "30"

          # Liveness 探针：失败 → kubelet 重启容器
          # 面试要点：liveness 失败说明容器不健康，k8s 自动重启
          livenessProbe:
            httpGet:
              path: /live
              port: 5000
            initialDelaySeconds: 5    # 启动后等 5 秒再检测
            periodSeconds: 10         # 每 10 秒检测一次
            failureThreshold: 3       # 连续 3 次失败才判定不健康

          # Readiness 探针：失败 → 从 Service Endpoint 摘除，不接收流量
          # 面试要点：readiness 失败不会重启容器，只是不接流量
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2

          # 资源限制：防止容器占用过多资源
          resources:
            requests:
              cpu: 100m               # 申请 0.1 核
              memory: 128Mi
            limits:
              cpu: 500m               # 上限 0.5 核
              memory: 256Mi

---
# ---- App Service ----
# Service：提供稳定的网络入口，Pod IP 会变但 Service IP 不变
# ClusterIP：仅集群内部可访问（面试常问 Service 类型区别）
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  selector:
    app.kubernetes.io/name: app    # 通过 label 选择 Pod
  ports:
    - name: http
      port: 5000                   # Service 端口
      targetPort: 5000             # 容器端口
  type: ClusterIP

---
# ---- Redis Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
# ---- Redis Service ----
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
